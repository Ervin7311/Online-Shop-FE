<div class="container">
  <div class="main-body">

    <nav aria-label="breadcrumb" class="main-breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">User Profile</li>
      </ol>
    </nav>

    <div class="row gutters-sm">
      <div class="col-md-4 mb-3">
        <div class="card">
          <div class="card-body">
            <div class="d-flex flex-column align-items-center text-center">
              <img src="https://bootdey.com/img/Content/avatar/avatar7.png" alt="User" class="rounded-circle" width="150">
              <div class="mt-3">
                <h4>{{ user?.fullName }}</h4>
                <p class="text-secondary mb-1">Full Stack Developer</p>
                <p class="text-muted font-size-sm">Bay Area, San Francisco, CA</p>
                <button class="btn btn-outline-primary">Contact</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-8">
        <div class="card mb-3">
          <div class="card-body" *ngIf="!editMode">

            <div class="row" *ngIf="user">
              <div class="col-sm-3"><h6 class="mb-0">Full Name</h6></div>
              <div class="col-sm-9 text-secondary">{{ user?.fullName }}</div>
            </div>
             <hr>
            <div class="row">
              <div class="col-sm-3"><h6 class="mb-0">Username</h6></div>
              <div class="col-sm-9 text-secondary">{{ user?.username }}</div>
            </div>
            <hr>
            <div class="row">
              <div class="col-sm-3"><h6 class="mb-0">Email</h6></div>
              <div class="col-sm-9 text-secondary">{{ user?.email }}</div>
            </div>
            <hr>
            <div class="row">
              <div class="col-sm-3"><h6 class="mb-0">Phone</h6></div>
              <div class="col-sm-9 text-secondary">{{ user?.phoneNumber }}</div>
            </div>
            <hr>

            <div class="row">
              <div class="col-sm-12">
                <button class="btn btn-info" (click)="enableEdit()">Edit</button>
              </div>
            </div>
          </div>

          <div class="card-body" *ngIf="editMode">
            <form [formGroup]="editForm" (ngSubmit)="saveChanges()">
              <div class="row mb-3">
                <label class="col-sm-3 col-form-label">Full Name</label>
                <div class="col-sm-9">
                  <input type="text" class="form-control" formControlName="fullName" />
                </div>
              </div>

              <div class="row mb-3">
                <label class="col-sm-3 col-form-label">Username</label>
                <div class="col-sm-9">
                  <input type="text" class="form-control" formControlName="username" />
                </div>
              </div>

              <div class="row mb-3">
                <label class="col-sm-3 col-form-label">Email</label>
                <div class="col-sm-9">
                  <input type="email" class="form-control" formControlName="email" />
                </div>
              </div>

              <div class="row mb-3">
                <label class="col-sm-3 col-form-label">Phone</label>
                <div class="col-sm-9">
                  <input type="text" class="form-control" formControlName="phoneNumber" />
                </div>
              </div>

              <div class="row">
                <div class="col-sm-12">
                  <button type="submit" class="btn btn-success me-2">Save</button>
                  <button type="button" class="btn btn-secondary" (click)="cancelEdit()">
                    <i class="fas fa-trash fa-lg"></i> Cancel
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
