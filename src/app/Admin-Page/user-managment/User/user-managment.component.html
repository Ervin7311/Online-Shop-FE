<div class="container mt-4 user-management-container">

    <!-- Filters -->
  <div class="d-flex mb-4 gap-3 justify-content-between align-items-center flex-wrap">
    <input type="text" class="form-control search-input" placeholder="Search by name"
           [(ngModel)]="searchName" (ngModelChange)="applyFilters()" />

    <select class="form-select filter-select" [(ngModel)]="selectedRole" (change)="applyFilters()">
      <option value="">All Roles</option>
      <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
    </select>

    <select class="form-select filter-select" [(ngModel)]="selectedStatus" (change)="applyFilters()">
      <option value="">All Status</option>
      <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
    </select>
  </div>
  
  <!-- User List -->
  <div *ngIf="!editingUser">
    <h2 class="mb-3">User List</h2>
    <table class="table table-striped table-bordered table-hover text-center shadow-sm">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Role</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.fullName }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.phoneNumber }}</td>
          <td>{{ user.role }}</td>
          <td>{{ user.status }}</td>
          <td>
            <button class="btn btn-warning btn-sm me-2" (click)="startEdit(user)">Edit</button>
            <button class="btn btn-danger btn-sm" (click)="deleteUser(user.id!)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Edit Form -->
  <div *ngIf="editingUser" class="card shadow-lg border-0">
    <div class="card-header bg-dark text-white">
      <h4 class="mb-0">Edit User</h4>
    </div>
    <div class="card-body bg-light">
      <form (ngSubmit)="updateUser()">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input class="form-control" [(ngModel)]="editingUser.fullName" name="fullName" readonly />
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input class="form-control" [(ngModel)]="editingUser.email" name="email" readonly />
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <input class="form-control" [(ngModel)]="editingUser.phoneNumber" name="phoneNumber" readonly />
          </div>

          <div class="col-md-3">
            <label class="form-label">Role</label>
            <select class="form-select" [(ngModel)]="editingUser.role" name="role">
              <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label">Status</label>
            <select class="form-select" [(ngModel)]="editingUser.status" name="status">
              <option *ngFor="let status of statuses" [value]="status">{{ status }}</option>
            </select>
          </div>
          <div class="mt-4 d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-warning btn-sm me-2" (click)="cancelEdit()">Cancel</button>
            <button type="submit" class="btn btn-success">Save Changes</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
