<h2 class="orders-title">🛒 Your Orders</h2>
<hr class="mb-4">

<div *ngIf="orders.length === 0" class="no-orders">
  <i class="fa-solid fa-box-open fa-2xl mb-3"></i>
  <span>You have no orders yet</span>
</div>


<div *ngFor="let order of orders" class="order-card">
  <div class="order-header">
    <div>
      <h3>Order #{{ order.orderId }}</h3>
      <p class="order-date">{{ order.orderDate | date:'mediumDate' }}</p>
    </div>
    <div class="order-status" [ngClass]="order.status.toLowerCase()">
      {{ order.status }}
    </div>
  </div>

  <div class="order-total">
    Total: <span>{{ order.totalAmount | currency }}</span>
  </div>

  <div class="order-items">
    <h4>🧾 Items</h4>
    <ul>
      <li *ngFor="let item of order.items">
        <div class="item-name">{{ item.productName }}</div>
        <div class="item-details">
          <span>Qty: {{ item.quantity }}</span>
          <span>{{ item.price | currency }}</span>
        </div>
      </li>
    </ul>
  </div>
</div>
