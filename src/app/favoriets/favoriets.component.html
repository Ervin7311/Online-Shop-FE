<div class="width-100%">
  <section class="h-100">
    <div class="container h-100 py-5">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-10">

          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-normal mb-0">Your Favorite Products</h3>
          </div>

          <div class="card rounded-3 mb-4">
            <div *ngFor="let item of favoriteItems" class="card-body p-4">
              <div class="row d-flex justify-content-between align-items-center">
                <div class="col-md-2 col-lg-2 col-xl-2">
                  <img [src]="item.product.imageUrl" class="img-fluid rounded-3" alt="Cotton T-shirt">
                </div>
                <div class="col-md-3 col-lg-3 col-xl-3">
                  <p class="lead fw-normal mb-2">{{item.product.name}}</p>
                </div>

                <div class="col-md-3 col-lg-2 col-xl-2 offset-lg-1">
                  <h5 class="mb-0">{{item.product.price | customCurrency}}</h5>
                </div>
                <div class="col-md-1 col-lg-1 col-xl-1 text-end">
                  <a class="text-danger" (click)="removeFavorite(item.id)">
                    <i class="fas fa-trash fa-lg"></i></a>
                </div>

              </div>
            </div>
          </div>
          @if(favoriteItems.length != 0) {
          <div class="card">
            <div class="card-body">
              <button type="button" data-mdb-button-init data-mdb-ripple-init
                class="btn btn-warning btn-block btn-lg">Proceed to Pay</button>
            </div>
          </div>
          }@else {
          <div class="no-item d-flex flex-column align-items-center justify-content-center">
            <i class="fa-regular fa-heart fa-2xl mb-3"></i>
            <span>There are no Favorites Items</span>
          </div>
          }
        </div>
      </div>
    </div>
  </section>
</div>
