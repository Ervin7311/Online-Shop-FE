<div class="card" [class.sold]="isSold">
  <div class="image-wrapper">
    <img [src]="imageUrl" alt="{{ name }}">
  </div>
  <div class="card-body">
    <h5 class="card-title">{{ name }}</h5>
    <p class="card-text">{{ description }}</p>
    <p class="card-price"><strong>{{ price | customCurrency}}</strong></p>
    <div *ngIf="isSold" class="sold-message">
      It was sold
    </div>
    <div class="d-flex align-items-center justify-content-between mt-3">
      <a class="btn btn-success custom-btn" [class.disabled]="cardService.productIsInCart(id)" (click)="addToCart(id)">
        @if (cardService.productIsInCart(id)) {
        Added to Cart
        } @else {
        Add to Cart
        }
      </a>
      <a class="heart" [class.disabled]="favoriteService.productIsInFavorites(id)" (click)="addToFavorites(id)">
        @if(favoriteService.productIsInFavorites(id)){
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" color="red"
          class="bi bi-heart-fill">
          <path fill-rule="evenodd" d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314" />
        </svg>
        }@else {
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
          color="red" width="20" height="20">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
        </svg>
        }
      </a>
    </div>
  </div>
</div>
